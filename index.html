<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Balloon Bear</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section id="scene">
    <div id="bear-area">
      <div id="balloons"></div>
      <div id="bear">🐻</div>
      <div id="hill"></div>
    </div>
  </section>
  <section id="play">
    <button id="picture" aria-label="Posłuchaj słowa"></button>
    <div id="word"></div>
    <div id="keyboard"></div>
    <button id="next" class="hidden" aria-label="Dalej">➡️</button>
    <div id="message" aria-live="polite"></div>
  </section>
</main>
<div id="confetti"></div>
<script src="script.js"></script>
</body>
</html>
